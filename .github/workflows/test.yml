name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.9.13
      - run: uv sync --frozen
      - run: npm test
      - run: uv run --frozen python -m unittest discover -s tests -p 'test_*.py' -v
      - run: npm run check:publication
      - name: Scan tracked source for secrets
        run: |
          uv tool run --from detect-secrets==1.5.0 detect-secrets scan --no-verify > "$RUNNER_TEMP/secrets.json"
          python -c 'import json, os; result = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "secrets.json"))); assert not result["results"], "Unexpected secret-scanner findings; inspect the scan locally."'
